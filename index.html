<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Optimizer Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 16px; margin: 0; }
        .card { max-width: 500px; margin: 0 auto; background: #131f37; padding: 20px; border-radius: 16px; border: 1px solid #1e2e4a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 22px; margin-top: 0; }
        .file-box { position: relative; border: 2px dashed #0284c7; border-radius: 12px; padding: 25px 10px; text-align: center; background: #070d19; margin-bottom: 16px; }
        .file-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #334155; opacity: 0.6; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; background: #070d19; padding: 12px; border-radius: 10px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        select, input[type="range"] { width: 100%; background: #131f37; color: white; border: 1px solid #1e2e4a; padding: 8px; border-radius: 6px; }
        .log { background: #040811; padding: 12px; border-radius: 8px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #1e2e4a; margin-top: 15px; }
        .success { color: #4ade80; margin-top: 5px; }
        .error { color: #f87171; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>4K Media Optimizer Pro</h1>
        
        <div class="file-box">
            <p id="fileStatus" style="margin:0; font-size:14px; color:#94a3b8;">📁 फोटो या वीडियो पर टैप करके चुनें</p>
            <input type="file" id="fileInput" accept="image/*,video/*">
        </div>

        <div class="controls">
            <div>
                <label>आउटपुट रेजोल्यूशन:</label>
                <select id="resolution">
                    <option value="original">ओरिजिनल</option>
                    <option value="1080">1080p Full HD</option>
                    <option value="4k" selected>4K Ultra HD</option>
                </select>
            </div>
            <div>
                <label>क्वालिटी: <strong id="qVal" style="color:#38bdf8;">85</strong>%</label>
                <input type="range" id="quality" min="40" max="98" value="85">
            </div>
        </div>

        <button class="btn" id="startBtn" disabled>प्रोसेसिंग शुरू करें</button>

        <div class="log" id="logBox">रेडी: फाइल चुनें...</div>
    </div>

    <script>
        let SERVER_URL = "https://media-optimizer-pro.onrender.com/process-media/";
        
        const fileInput = document.getElementById('fileInput');
        const fileStatus = document.getElementById('fileStatus');
        const startBtn = document.getElementById('startBtn');
        const qualityInput = document.getElementById('quality');
        const qVal = document.getElementById('qVal');
        const resolutionSelect = document.getElementById('resolution');
        const logBox = document.getElementById('logBox');

        let selectedFile = null;

        qualityInput.addEventListener('input', () => qVal.textContent = qualityInput.value);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileStatus.textContent = `✔ चुनी गई फाइल: ${selectedFile.name}`;
                fileStatus.style.color = "#38bdf8";
                logBox.innerHTML = `तैयार: ${selectedFile.name}`;
                startBtn.disabled = false;
            }
        });

        startBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            startBtn.disabled = true;
            logBox.innerHTML = 'सर्वर पर 4K प्रोसेसिंग चालू है...<br>';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('mode', 'compress');
            formData.append('resolution', resolutionSelect.value);
            formData.append('quality', qualityInput.value);

            try {
                const response = await fetch(SERVER_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('सर्वर प्रोसेसिंग एरर');

                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `4K_${selectedFile.name}`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                logBox.innerHTML += `<div class="success">🎉 4K कंवर्ट पूरा हुआ! डाउनलोड शुरू हो गया है।</div>`;
            } catch (err) {
                logBox.innerHTML += `<div class="error">✖ एरर: ${err.message}</div>`;
            }
            startBtn.disabled = false;
        });
    </script>
</body>
</html>

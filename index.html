<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Optimizer Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1329; color: #f8fafc; padding: 16px; margin: 0; }
        .card { max-width: 500px; margin: 0 auto; background: #131f37; padding: 20px; border-radius: 16px; border: 1px solid #1e2e4a; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #38bdf8; font-size: 22px; margin-top: 0; }
        .drop-zone { border: 2px dashed #0284c7; border-radius: 12px; padding: 30px 15px; text-align: center; background: #070d19; cursor: pointer; margin-bottom: 16px; }
        input[type="file"] { display: none; }
        .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; font-size: 16px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { background: #334155; opacity: 0.6; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; background: #070d19; padding: 12px; border-radius: 10px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
        select, input[type="range"] { width: 100%; background: #131f37; color: white; border: 1px solid #1e2e4a; padding: 8px; border-radius: 6px; }
        .log { background: #040811; padding: 12px; border-radius: 8px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 12px; border: 1px solid #1e2e4a; margin-top: 15px; }
        .success { color: #4ade80; margin-bottom: 4px; }
        .error { color: #f87171; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>4K Media Optimizer Pro</h1>
        
        <div class="drop-zone" id="dropZone">
            <p style="margin:0; font-size:14px; color:#94a3b8;">फोटो व वीडियो चुनें या ड्रैग करें</p>
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <div class="controls">
            <div>
                <label>आउटपुट रेजोल्यूशन:</label>
                <select id="resolution">
                    <option value="original" selected>ओरिजिनल</option>
                    <option value="1080">1080p Full HD</option>
                    <option value="4k">4K Ultra HD</option>
                </select>
            </div>
            <div>
                <label>क्वालिटी: <strong id="qVal" style="color:#38bdf8;">85</strong>%</label>
                <input type="range" id="quality" min="40" max="98" value="85">
            </div>
        </div>

        <button class="btn" id="startBtn" disabled>प्रोसेसिंग शुरू करें</button>

        <div class="log" id="logBox">रेडी: फाइल चुनें...</div>
    </div>

    <script>
        let SERVER_URL = "https://media-optimizer-pro.onrender.com/process-media/";

        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const startBtn = document.getElementById('startBtn');
        const qualityInput = document.getElementById('quality');
        const qVal = document.getElementById('qVal');
        const resolutionSelect = document.getElementById('resolution');
        const logBox = document.getElementById('logBox');

        let selectedFiles = [];

        qualityInput.addEventListener('input', () => qVal.textContent = qualityInput.value);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            if (selectedFiles.length > 0) {
                logBox.innerHTML = `तैयार: ${selectedFiles.length} फाइलें चुनी गईं।`;
                startBtn.disabled = false;
            }
        }

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            logBox.innerHTML = 'प्रोसेसिंग चालू है...<br>';

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                logBox.innerHTML += `<div>प्रोसेसिंग: ${file.name}...</div>`;

                const formData = new FormData();
                formData.append('file', file);
                formData.append('mode', 'compress');
                formData.append('resolution', resolutionSelect.value);
                formData.append('quality', qualityInput.value);

                try {
                    const response = await fetch(SERVER_URL, { method: 'POST', body: formData });
                    if (!response.ok) throw new Error('सर्वर एरर');

                    const blob = await response.blob();
                    const downloadUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `optimized_${file.name}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    logBox.innerHTML += `<div class="success">✔ ${file.name} कंवर्ट हो गया!</div>`;
                } catch (err) {
                    logBox.innerHTML += `<div class="error">✖ ${file.name} - ${err.message}</div>`;
                }
            }
            startBtn.disabled = false;
        });
    </script>
</body>
</html>
